<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Customers — Nishat Fashion</title>

    <link rel="stylesheet" href="admin.css">

    <link
        rel="stylesheet"
        href="customers.css"
    >

</head>


<body>


    <!-- ADMIN HEADER -->
    <div id="appShell"></div>


    <!-- MAIN -->
    <main class="admin-container">


        <!-- PAGE HEADER -->
        <div class="page-top">

            <div>

                <div class="eyebrow">
                    NISHAT FASHION
                </div>

                <h1>
                    Customers
                </h1>

                <p>
                    Customer accounts and order activity.
                </p>

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
                type="button"
            >
                ↻ Refresh
            </button>

        </div>


        <!-- CUSTOMER SUMMARY -->
        <section class="customer-stats">

            <div class="customer-stat">

                <span>
                    Total Customers
                </span>

                <strong id="customerCount">
                    0
                </strong>

            </div>


            <div class="customer-stat">

                <span>
                    Customers With Orders
                </span>

                <strong id="activeCustomerCount">
                    0
                </strong>

            </div>


            <div class="customer-stat">

                <span>
                    Total Customer Orders
                </span>

                <strong id="totalCustomerOrders">
                    0
                </strong>

            </div>


            <div class="customer-stat">

                <span>
                    Total Spent
                </span>

                <strong id="totalSpent">
                    ৳0
                </strong>

            </div>

        </section>


        <!-- SEARCH -->
        <section class="panel customer-filter">

            <div class="search-box">

                <span>⌕</span>

                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search customer name, email..."
                    autocomplete="off"
                >

            </div>

        </section>


        <!-- CUSTOMERS TABLE -->
        <section class="panel customers-panel">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Customer
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Joined
                            </th>

                            <th>
                                Orders
                            </th>

                            <th>
                                Spent
                            </th>

                        </tr>

                    </thead>


                    <tbody id="customersBody">

                        <tr>

                            <td
                                colspan="5"
                                class="table-empty"
                            >

                                <div class="loading-inline">

                                    <span class="spinner"></span>

                                    Loading customers...

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- CLICK LOADING -->
    <div
        id="clickLoading"
        class="click-loading hidden"
    >

        <div class="click-loading-box">

            <span class="spinner large"></span>

            <p>
                Processing...
            </p>

        </div>

    </div>


    <!-- TOAST -->
    <div
        id="toast"
        class="toast"
    ></div>


    <script
        type="module"
        src="customers.js"
    ></script>

</body>

</html>
