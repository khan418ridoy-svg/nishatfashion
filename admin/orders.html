<!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders — Nishat Fashion</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="orders.css">

</head>


<body>


    <!-- ADMIN HEADER -->
    <div id="appShell"></div>


    <!-- MAIN CONTENT -->
    <main class="admin-container">


        <!-- PAGE HEADER -->
        <div class="page-top">

            <div>

                <div class="eyebrow">
                    NISHAT FASHION
                </div>

                <h1>
                    Orders
                </h1>

                <p>
                    Track and manage customer orders.
                </p>

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
                type="button"
            >
                ↻ Refresh
            </button>

        </div>


        <!-- FILTER -->
        <section class="panel filter-panel">

            <div class="toolbar">

                <div class="search-box">

                    <span>⌕</span>

                    <input
                        id="searchInput"
                        type="search"
                        placeholder="Search order, customer, phone..."
                        autocomplete="off"
                    >

                </div>


                <select id="statusFilter">

                    <option value="">
                        All statuses
                    </option>

                    <option value="pending">
                        Pending
                    </option>

                    <option value="confirmed">
                        Confirmed
                    </option>

                    <option value="processing">
                        Processing
                    </option>

                    <option value="packed">
                        Packed
                    </option>

                    <option value="shipped">
                        Shipped
                    </option>

                    <option value="delivered">
                        Delivered
                    </option>

                    <option value="cancelled">
                        Cancelled
                    </option>

                    <option value="returned">
                        Returned
                    </option>

                </select>

            </div>

        </section>


        <!-- ORDER COUNT -->
        <div class="orders-summary">

            <span>
                Total Orders:
                <strong id="orderCount">0</strong>
            </span>

        </div>


        <!-- ORDERS TABLE -->
        <section class="panel orders-panel">

            <div class="table-wrap">

                <table>

                    <thead>

                        <tr>

                            <th>Order</th>

                            <th>Customer</th>

                            <th>Date</th>

                            <th>Payment</th>

                            <th>Status</th>

                            <th>Total</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="ordersBody">

                        <tr>

                            <td
                                colspan="7"
                                class="table-empty"
                            >

                                <div class="loading-inline">

                                    <span class="spinner"></span>

                                    Loading orders...

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- GLOBAL CLICK LOADING -->
    <div
        id="clickLoading"
        class="click-loading hidden"
    >

        <div class="click-loading-box">

            <span class="spinner large"></span>

            <p>
                Processing...
            </p>

        </div>

    </div>


    <!-- TOAST -->
    <div
        id="toast"
        class="toast"
    ></div>


    <script
        type="module"
        src="orders.js"
    ></script>

</body>

</html>
