<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nishat Fashion - Admin Login</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <div class="logo-box">
            <img src="../asset/logo.png" alt="Nishat Fashion">
        </div>

        <h1>Admin Login</h1>
        <p class="subtitle">Nishat Fashion Administration</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter admin email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                    >
                        Show
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >
                Sign In
            </button>

            <div id="loginMessage" class="message"></div>

        </form>

    </div>

</div>


<div id="adminClickLoading" class="admin-click-loading hidden" aria-live="polite"><div class="admin-click-loading-box"><div class="admin-click-spinner"></div><div id="adminClickLoadingText">Please wait...</div></div></div>
<script type="module" src="admin.js"></script>

</body>
</html>
