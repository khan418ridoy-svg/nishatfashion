  <!doctype html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Order Details — Nishat Fashion</title>

    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="order-details.css">

</head>


<body>

    <!-- ADMIN HEADER -->
    <div id="appShell"></div>


    <!-- MAIN CONTENT -->
    <main class="admin-container">

        <div class="page-top">

            <div>

                <div class="eyebrow">
                    NISHAT FASHION
                </div>

                <h1>
                    Order Details
                </h1>

                <p id="orderTitle">
                    Loading order...
                </p>

            </div>


            <a
                href="orders.html"
                class="back-btn"
            >
                ← Orders
            </a>

        </div>


        <!-- ORDER DETAILS -->
        <section
            id="orderPanel"
            class="panel order-details-panel"
        >

            <div class="loading-inline">

                <span class="spinner"></span>

                Loading order...

            </div>

        </section>


    </main>


    <!-- CLICK LOADING -->
    <div
        id="clickLoading"
        class="click-loading hidden"
    >

        <div class="click-loading-box">

            <span class="spinner large"></span>

            <p>
                Updating...
            </p>

        </div>

    </div>


    <!-- TOAST -->
    <div
        id="toast"
        class="toast"
    ></div>


    <script
        type="module"
        src="order-details.js"
    ></script>

</body>

</html>
